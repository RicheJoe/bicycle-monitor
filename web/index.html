<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <script>
      ;(function () {
        function stopGesture(event) {
          event.preventDefault()
        }
        document.addEventListener("gesturestart", stopGesture, { passive: false })
        document.addEventListener("gesturechange", stopGesture, { passive: false })
        document.addEventListener("gestureend", stopGesture, { passive: false })
        var lastTouchEnd = 0
        document.addEventListener(
          "touchend",
          function (event) {
            var now = Date.now()
            if (now - lastTouchEnd < 300) event.preventDefault()
            lastTouchEnd = now
          },
          { passive: false }
        )
        document.addEventListener(
          "touchmove",
          function (event) {
            if (event.touches.length < 2) return
            var target = event.target
            if (target && target.closest && target.closest(".amap")) return
            event.preventDefault()
          },
          { passive: false }
        )
        function resetPageZoom() {
          var viewport = window.visualViewport
          if (!viewport || viewport.scale <= 1.01) return
          var current = document.querySelector('meta[name="viewport"]')
          if (current) current.remove()
          var meta = document.createElement("meta")
          meta.name = "viewport"
          meta.content =
            "width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
          document.head.appendChild(meta)
        }
        if (window.visualViewport) window.visualViewport.addEventListener("resize", resetPageZoom)
      })()
    </script>
    <title>单车骑行</title>
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
